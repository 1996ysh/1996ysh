name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F8A5C2&color_dots=#ebedf0,#FDE2E4,#F8C8DC,#F8A5C2,#A8E6CF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F8A5C2&color_dots=#161b22,#3d2a32,#6b4554,#F8A5C2,#A8E6CF

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
